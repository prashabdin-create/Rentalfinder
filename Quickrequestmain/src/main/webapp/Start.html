<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Choose Your Role</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-image: url("images/Screen.png");
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
      padding: 20px;
    }

    .login-box {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px;
      border: 2px solid #0d6efd;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .login-box h2 {
      background-color: #aadeff;
      padding: 10px;
      border-radius: 8px;
      color: #0d6efd;
      font-weight: bold;
      margin-bottom: 30px;
      font-size: 1.5rem;
    }

    .logo-img {
      border-radius: 50%;
      border: 2px solid #0d6efd;
      margin-bottom: 20px;
      transition: transform 0.3s ease;
      height: 60px;
      width: 60px;
    }

    .logo-img:hover {
      transform: scale(1.1);
    }

    .role-btn {
      display: block;
      width: 100%;
      margin-bottom: 20px;
      padding: 12px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 50px;
      border: 2px solid #0d6efd;
      background-color: #ffffff;
      color: #0d6efd;
      transition: all 0.3s ease;
    }

    .role-btn:hover {
      background-color: #0d6efd;
      color: #ffffff;
      text-decoration: none;
    }

   
    @media (max-width: 576px) {
      .login-box {
        padding: 25px 20px;
        max-width: 100%;
      }

      .login-box h2 {
        font-size: 1.2rem;
        margin-bottom: 20px;
      }

      .logo-img {
        height: 50px;
        width: 50px;
      }

      .role-btn {
        font-size: 0.95rem;
        padding: 10px;
        margin-bottom: 15px;
      }
    }

    @media (max-width: 360px) {
      .login-box {
        padding: 20px 15px;
      }

      .role-btn {
        font-size: 0.9rem;
        padding: 8px;
      }

      .logo-img {
        height: 45px;
        width: 45px;
      }
    }
  </style>
</head>
<body>
  <div class="login-box">
    <img src="images/Lgo - Copy.png" alt="Logo" class="logo-img">
    <h2>Choose Your Role</h2>
    
    <a href="SignupEmployee.jsp" class="role-btn">EMPLOYEE</a>
    <a href="LoginAdmin.jsp" class="role-btn">ADMIN</a>
  </div>
</body>
</html>
