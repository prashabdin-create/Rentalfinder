{% extends "base.html" %}{% block title %}Create {{ role|capitalize }} Account{% endblock %}
{% block content %}<main class="auth-page"><div class="auth-card wide"><div class="auth-icon">{{ '🎓' if role=='student' else '🏡' }}</div><span class="section-kicker">CREATE ACCOUNT</span><h1>Join Rental Finder</h1><p class="muted">Create your {{ role }} account and start using the platform.</p><form method="post"><label>Full name</label><input name="name" required placeholder="Your full name"><label>Email address</label><input type="email" name="email" required placeholder="you@gmail.com"><label>Phone number</label><input name="phone" placeholder="+91 98765 43210"><label>Password</label><input type="password" name="password" minlength="6" required placeholder="At least 6 characters"><button class="btn primary full">Create account</button></form><p class="switch">Already registered? <a href="{{ url_for('login', role=role) }}">Log in</a></p></div></main>{% endblock %}
